<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Game</title>
  <style>
    html,body { height:100%; margin:0; background:#111; color:white; font-family:"Times New Roman",serif }
    body { display:grid; place-items:center }
    #game-container { display:flex; flex-direction:column; align-items:center; gap:10px }
    #tutorial-text { width:800px; max-width:100vw; min-height:44px; margin:0; text-align:center; color:#0f0; font:18px "Times New Roman",serif }
    #tutorial-text[hidden] { display:none }
    canvas { width:800px; height:600px; max-width:100vw; max-height:75vw; border:1px solid #444; background:#000; image-rendering:auto; touch-action:none }
  </style>
</head>
<body>
<main id="game-container">
<p id="tutorial-text" hidden>tutorial text goes here</p>
<canvas id="game" width="800" height="600" tabindex="0" aria-label="Space strategy game"></canvas>
</main>
<script src="AnimateGifs.js"></script>
<script>
"use strict";

// This is a direct browser port of Game.java.  The names and data layout are
// deliberately kept close to the original so the two versions remain comparable.
const canvas = document.getElementById("game");
const g = canvas.getContext("2d");

// AI Tutorial - beginning
const tutorialText = document.getElementById("tutorial-text");
let isTutorial = false;
let tutorialStep = 0;

const tutorialSteps = [
  "Click the teleport beacon (the blinking light).",
  "Click “Generator” in the lower right corner.",
  "Click in space to teleport one in.",
  "You'll want a lot of energy; teleport in more.",
  "Scroll up to the top of the map using the up arrow key, or click in the lower left map.",
  "These are the ships that need to be destroyed. Scroll back to your teleport beacon.",
  "You'll need ships to fight. Click the teleport beacon again.",
  "Click “Teleporter” in the lower right corner.",
  "Click in space to teleport it in.",
  "Click the Teleporter.",
  "Click “Fighter” in the lower right hand corner. (Hotkey 'a')",
  "Click in space to teleport one in.",
  "Teleport in a few more.",
  "Click and drag to select some fighters.",
  "Scroll to an enemy unit and order them to attack. (Hotkey 'a')",
  "That's all you need to know. Now build a more powerful fleet and defeat the enemy. Try some other types of teleporters."
];

function showTutorialStep() {
  tutorialText.replaceChildren();
  const text = tutorialSteps[tutorialStep];
  const parts = text.length > 75 ? text.split(/(?<=[.,])[ ]+/) : [text];
  parts.forEach((part,index) => {
    if (index) tutorialText.append(document.createElement("br"));
    tutorialText.append(document.createTextNode(part));
  });
}

function advanceTutorial(event,type=0) {
  if (!isTutorial) return;
  const selectedType = selected[0] !== -1 && stuff[selected[0]] ? stuff[selected[0]][2] : 0;
  const completed =
    (tutorialStep===0 && event==="select" && type===51) ||
    (tutorialStep===1 && event==="command" && selectedType===51 && type===1) ||
    (tutorialStep===2 && event==="build" && type===52) ||
    (tutorialStep===3 && event==="build" && type===52) ||
    (tutorialStep===4 && event==="top") ||
    (tutorialStep===5 && event==="beacon-view") ||
    (tutorialStep===6 && event==="select" && type===51) ||
    (tutorialStep===7 && event==="command" && selectedType===51 && type===2) ||
    (tutorialStep===8 && event==="build" && type===53) ||
    (tutorialStep===9 && event==="select" && type===53) ||
    (tutorialStep===10 && event==="command" && selectedType===53 && type===1) ||
    (tutorialStep===11 && event==="build" && type===1) ||
    (tutorialStep===12 && event==="build" && type===1) ||
    (tutorialStep===13 && event==="fighter-drag" && type>=2) ||
    (tutorialStep===14 && event==="attack-order");
  if (completed && tutorialStep < tutorialSteps.length-1) {
    tutorialStep++;
    showTutorialStep();
  }
}

const tutorialStuff = [
  [725,1350,51,200,0,0,0,0],
  // Six space guns across the top.
  [650,0,-3,25,3,0,0,0],[700,0,-3,25,3,0,0,0],[750,0,-3,25,3,0,0,0],
  [800,0,-3,25,3,0,0,0],[850,0,-3,25,3,0,0,0],[900,0,-3,25,3,0,0,0],
  // Seven battleships underneath the guns.
  [625,50,-2,20,3,0,0,0],[675,50,-2,20,3,0,0,0],[725,50,-2,20,3,0,0,0],[775,50,-2,20,3,0,0,0],
  [825,50,-2,20,3,0,0,0],[875,50,-2,20,3,0,0,0],[925,50,-2,20,3,0,0,0],
  // Eleven fighters, with tight groups of three on both sides.
[600,100,-1,7,3,0,0,0],[635,100,-1,7,3,0,0,0],[670,100,-1,7,3,0,0,0],[705,100,-1,7,3,0,0,0],[740,100,-1,7,3,0,0,0],
[775,100,-1,7,3,0,0,0],[810,100,-1,7,3,0,0,0],[845,100,-1,7,3,0,0,0],[880,100,-1,7,3,0,0,0],[915,100,-1,7,3,0,0,0],[950,100,-1,7,3,0,0,0],
  [550,30,-1,7,3,0,0,0],[575,50,-1,7,3,0,0,0],[550,70,-1,7,3,0,0,0],
  [1000,30,-1,7,3,0,0,0],[975,50,-1,7,3,0,0,0],[1000,70,-1,7,3,0,0,0],

  // Fifteen widely dispersed fighters in three descending rows.
  [120,280,-1,7,3,0,0,0],[440,250,-1,7,3,0,0,0],[760,290,-1,7,3,0,0,0],[1080,250,-1,7,3,0,0,0],[1400,280,-1,7,3,0,0,0],
  [260,300,-3,7,3,0,0,0],[580,340,-1,7,3,0,0,0],[900,390,-2,7,3,0,0,0],[1220,340,-1,7,3,0,0,0],[1500,300,-1,7,3,0,0,0],
  [100,460,-3,7,3,0,0,0],[420,410,-1,7,3,0,0,0],[1040,470,-1,7,3,0,0,0],[1360,420,-2,7,3,0,0,0],[1550,430,-1,7,3,0,0,0]
];

function resetTutorialGame() {
  stuff = tutorialStuff.map(row => row.slice());
  energy = 3000; selected = [-1]; action = 0; mapx = 400; mapy = 1100;
  isTutorial = true;
  tutorialStep = 0;
  tutorialText.hidden = false;
  showTutorialStep();
}

function loadTutorial() {
  resetTutorialGame();
  area = 10;
  canvas.focus();
}

function leaveTutorial() {
  isTutorial = false;
  tutorialText.hidden = true;
}
// AI Tutorial - end

// Frame delays come from each original GIF's Graphic Control Extension.
const imageFrameDelays = {
  fighter:[0],
  advanced:[200,200,200,200,200,200,200,200],
  beacon:[1000,500],
  destroy:[0],
  edestroy:[0],
  efighter:[0],
  egun:[200,200,200,200,200],
  generator:[100,100,100,100,100,100,100,100,100,100,100,100,100],
  gun:[200,200,200,200],
  large:[200,200,200,200,200,200,200,200],
  teleport:[200,200,200,200,200,200]
};
const images = {};
const currentFrames = {};
const animationState = {};
let imagesReady = false;

let area = 1, level = 0, energy = 3000;
let mdx = 0, mdy = 0, dragShift = false;
let keyscroll = 20, mousescroll = 20, speed = 20;
let action = 0, selected = [-1];
// It looks like this is [speed, size, damage, range]
const gunits = [[5,30,1,100],[3,45,3,120],[3,45,2,180]];
const bcommands = [
  ["Generator","Teleporter","Large Teleporter","Advanced Teleporter"],
  ["","","",""], ["Fighter","","",""], ["Destroyer","","",""], ["Space Gun","","",""]
];
const act = ["","Attack","Move","Stop"," "];
const mapsizex = 1600, mapsizey = 1600;
let mapx = 400, mapy = 1100, scrollx = 0, scrolly = 0;
let stuff;

// Generate once so stars stay in place as the camera moves and returns.
const starLayers = [
  {count:90, depth:0.12, brightness:60},
  {count:45, depth:0.28, brightness:90},
  {count:16, depth:0.48, brightness:125}
].map((layer,index) => ({
  ...layer,
  stars:Array.from({length:layer.count},() => ({
    x:Math.random()*800,
    y:Math.random()*500,
    brightness:layer.brightness+Math.floor(Math.random()*30),
    twinkle:index===2,
    period:2400+Math.random()*3600,
    phase:Math.random()*6000
  }))
}));

function drawStarfield(now) {
  g.save();
  g.beginPath(); g.rect(0,0,800,500); g.clip();
  for (const layer of starLayers) {
    for (const star of layer.stars) {
      const x=Math.floor(((star.x-mapx*layer.depth)%800+800)%800);
      const y=Math.floor(((star.y-mapy*layer.depth)%500+500)%500);
      const shade=star.brightness;
      g.fillStyle=`rgb(${shade},${shade},${shade})`;
      g.fillRect(x,y,1,1);
      if (star.twinkle) {
        // Five pixels within a 3x3 footprint; staggered, slow shape changes.
        const diagonal=Math.floor((now+star.phase)/star.period)%2===0;
        if (diagonal) {
          g.fillRect(x-1,y-1,1,1); g.fillRect(x+1,y-1,1,1);
          g.fillRect(x-1,y+1,1,1); g.fillRect(x+1,y+1,1,1);
        } else {
          g.fillRect(x-1,y,1,1); g.fillRect(x+1,y,1,1);
          g.fillRect(x,y-1,1,1); g.fillRect(x,y+1,1,1);
        }
      }
    }
  }
  g.restore();
}

const initialStuff = [
  [725,1350,51,200,0,0,0,0],[50,50,-3,25,3,0,0,0],[1400,140,-3,25,3,0,0,0],
  [1400,830,-3,25,3,0,0,0],[30,79,-3,25,3,0,0,0],[760,80,-3,25,3,0,0,0],
  [290,170,-2,20,3,0,0,0],[1090,170,-2,20,3,0,0,0],[1100,770,-2,20,3,0,0,0],
  [1330,1330,-2,20,3,0,0,0],[1400,280,-1,7,3,0,0,0],[609,740,-1,7,3,0,0,0],
  [670,730,-1,7,3,0,0,0],[870,240,-1,7,3,0,0,0],[960,670,-1,7,3,0,0,0],
  [30,930,-1,50,3,0,0,0],[70,1460,-1,7,3,0,0,0],[590,480,-1,7,3,0,0,0]
];

function resetGame() {
  stuff = initialStuff.map(row => row.slice());
  energy = 3000; selected = [-1]; action = 0; mapx = 400; mapy = 1100;
  leaveTutorial();
}
resetGame();

function preloadImages() {
  return Promise.all(Object.entries(imageFrameDelays).map(async ([name,delays]) => {
    const animation = new Animation();
    const frames = await Promise.all(Array.from({length:delays.length},(_,index) => new Promise((resolve,reject) => {
      const image = new Image();
      image.onload = () => resolve(image);
      image.onerror = () => reject(new Error(`Could not load images/frames/${name}-${index}.png`));
      image.src = `images/frames/${name}-${index}.png`;
    })));
    frames.forEach(frame => animation.addFrame(frame));
    images[name] = animation;
    currentFrames[name] = animation.getFrame();
    animationState[name] = {delays, frameIndex:0, nextFrameAt:null};
  })).then(() => imagesReady = true);
}

function updateAnimatedFrames(now) {
  if (!imagesReady) return;
  Object.entries(images).forEach(([name,animation]) => {
    const state=animationState[name];
    if (state.delays.length===1) return;
    if (state.nextFrameAt===null) {
      state.nextFrameAt=now+state.delays[state.frameIndex];
      return;
    }
    // Catch up after a hidden tab without permanently changing animation speed.
    while (now>=state.nextFrameAt) {
      currentFrames[name]=animation.getFrame();
      state.frameIndex=(state.frameIndex+1)%state.delays.length;
      state.nextFrameAt+=state.delays[state.frameIndex];
    }
  });
}

function mousePosition(e) {
  const r = canvas.getBoundingClientRect();
  return { x:(e.clientX-r.left)*800/r.width, y:(e.clientY-r.top)*600/r.height };
}
function button(x,y,w,h,label) {
  g.fillStyle = "#ddd"; g.fillRect(x,y,w,h);
  g.strokeStyle = "#777"; g.strokeRect(x+.5,y+.5,w-1,h-1);
  g.fillStyle = "#000"; g.font = "14px sans-serif"; g.textAlign = "center";
  g.textBaseline = "middle"; g.fillText(label,x+w/2,y+h/2);
}
function inRect(p,x,y,w,h) { return p.x >= x && p.x <= x+w && p.y >= y && p.y <= y+h; }
function unitSize(type) { return type > 50 ? 150 : gunits[Math.abs(type)-1][1]; }
function squareroot(square) { return Math.max(1, Math.floor(Math.sqrt(Math.abs(square)+1))); }
function getdistance(i,j) {
  return squareroot((stuff[i][0]-stuff[j][0])**2+(stuff[i][1]-stuff[j][1])**2);
}

function loadmap() { resetGame(); area = 10; canvas.focus(); }

canvas.addEventListener("pointerdown", e => {
  const p = mousePosition(e);
  canvas.setPointerCapture(e.pointerId);
  canvas.focus();
  if (area === 1) {
    if (inRect(p,100,520,280,55)) loadTutorial();
    else if (inRect(p,420,520,280,55)) loadmap();
    return;
  }
  if (area === 2 || area === 12) {
    if (inRect(p,360,450,81,50)) { area=1; level=0; }
    else if (area === 2 && inRect(p,700,500,81,50)) area=10;
    return;
  }
  if (area !== 10) return;

  if (p.x < 100 && p.y > 500) {
    mapx = Math.max(0,Math.min(mapsizex-800,p.x*mapsizex/100-400));
    mapy = Math.max(0,Math.min(mapsizey-500,(p.y-500)*mapsizey/100-250));
    if (mapy<=200) advanceTutorial("top");
    if (mapy>=1000) advanceTutorial("beacon-view");
  }
  mdx=p.x+mapx; mdy=p.y+mapy; dragShift=e.shiftKey;
  if (p.y < 500) {
    if (action===0 || selected[0]===-1) {
      let hit=-1;
      for (let i=0;i<stuff.length;i++) {
        const size=unitSize(stuff[i][2]);
        if (stuff[i][2]>0 && inRect({x:p.x+mapx,y:p.y+mapy},stuff[i][0],stuff[i][1],size,size)) hit=i;
      }
      if (hit!==-1) {
        if (e.shiftKey && selected[0]!==-1 && stuff[hit][2]<50 && stuff[selected[0]][2]<50) {
          if (!selected.includes(hit)) selected.push(hit);
        } else selected=[hit];
        advanceTutorial("select",stuff[hit][2]);
      }
    } else if (stuff[selected[0]][2] < 50) {
      const issuedAction=action;
      const orderedEnemy=stuff.some(s => {
        const size=unitSize(s[2]);
        return s[2]<0 && inRect({x:p.x+mapx,y:p.y+mapy},s[0],s[1],size,size);
      });
      selected.forEach(i => { stuff[i][4]=action; stuff[i][5]=p.x+mapx; stuff[i][6]=p.y+mapy; });
      action=0;
      if (issuedAction===1 && orderedEnemy) advanceTutorial("attack-order");
    } else {
      buildAt(p.x+mapx,p.y+mapy);
      action=isTutorial && (tutorialStep===3 || tutorialStep===12) ? 1 : 0;
    }
  }
  if (selected[0]!==-1 && p.y>500 && p.x>600 && p.y<566) {
    action = p.x<700 ? (p.y<533?1:3) : (p.y<533?2:4);
    if (action>1 && stuff[selected[0]][2]>51) action=0;
    if (stuff[selected[0]][2]===52) action=0;
    advanceTutorial("command",action);
  }
});

function buildAt(x,y) {
  const type=stuff[selected[0]][2];
  const choices = [[x,y,52,50,0,0,0,0],[x,y,53,75,0,0,0,0],
    [x,y,54,100,0,0,0,0],[x,y,55,100,0,0,0,0],
    [x,y,1,5,3,0,0,0],[x,y,2,15,3,0,0,0],[x,y,3,20,3,0,0,0]];
  let item=null, cost=Infinity;
  if (type===51 && action>=1 && action<=4) { item=choices[action-1]; cost=action===1?1000:action*300-300; }
  if (type===53 && action===1) { item=choices[4]; cost=100; }
  if (type===54 && action===1) { item=choices[5]; cost=200; }
  if (type===55 && action===1) { item=choices[6]; cost=350; }
  if (item && energy>=cost) {
    energy-=cost;
    stuff.push(item);
    advanceTutorial("build",item[2]);
  }
}

canvas.addEventListener("pointerup", e => {
  if (area!==10 || !mdx) return;
  const p=mousePosition(e), endx=p.x+mapx, endy=p.y+mapy;
  if ((endx-mdx)**2>2500 && (endy-mdy)**2>2500) {
    const lx=Math.min(mdx,endx), gx=Math.max(mdx,endx), ly=Math.min(mdy,endy), gy=Math.max(mdy,endy);
    let found = dragShift && selected[0]!==-1 && stuff[selected[0]][2]<50 ? selected.slice() : [];
    for (let i=0;i<stuff.length;i++) {
      if (stuff[i][2]>0 && stuff[i][2]<50) {
        const size=unitSize(stuff[i][2]);
        if (stuff[i][0]+size>lx && stuff[i][0]<gx && stuff[i][1]+size>ly && stuff[i][1]<gy && !found.includes(i)) found.push(i);
      }
    }
    selected=found.length?found:[-1];
    const fighterCount=found.filter(i=>stuff[i] && stuff[i][2]===1).length;
    advanceTutorial("fighter-drag",fighterCount);
  }
  mdx=mdy=0;
});

canvas.addEventListener("pointermove", e => {
  if (area!==10) return;
  const p=mousePosition(e);
  scrollx=p.x<15?-mousescroll:p.x>785?mousescroll:0;
  scrolly=p.y<15?-mousescroll:p.y>485&&p.y<500?mousescroll:0;
});
canvas.addEventListener("pointerleave",()=>{ scrollx=scrolly=0; });
canvas.addEventListener("contextmenu",e=>e.preventDefault());

window.addEventListener("keydown", e => {
  if (area!==10) return;
  if (["ArrowDown","ArrowUp","ArrowLeft","ArrowRight","Escape"].includes(e.key)) e.preventDefault();
  if (e.key==="ArrowDown") {
    mapy=Math.min(mapsizey-500,mapy+keyscroll);
    if (isTutorial && tutorialStep===5) mapy=1100;
    if (mapy>=1000) advanceTutorial("beacon-view");
  }
  if (e.key==="ArrowUp") {
    mapy=Math.max(0,mapy-keyscroll);
    if (isTutorial && tutorialStep===4) mapy=0;
    if (mapy<=200) advanceTutorial("top");
  }
  if (e.key==="ArrowLeft") mapx=Math.max(0,mapx-keyscroll);
  if (e.key==="ArrowRight") mapx=Math.min(mapsizex-800,mapx+keyscroll);
  if (e.key==="Escape") area=2;
  if (e.key.toLowerCase()==="a") {
    action=1;
    advanceTutorial("command",action);
  }
  if (e.key.toLowerCase()==="m") action=2;
  if (e.key.toLowerCase()==="s") action=3;
});

function updateGame() {
  if (scrollx) mapx=Math.max(0,Math.min(mapsizex-800,mapx+scrollx));
  if (scrolly) mapy=Math.max(0,Math.min(mapsizey-500,mapy+scrolly));
  if (mapy<=200) advanceTutorial("top");
  if (mapy>=1000) advanceTutorial("beacon-view");
  for (let i=0;i<stuff.length;i++) {
    if (stuff[i][2]===52) energy++;
    if (stuff[i][2]>=50) continue;
    const unit=Math.abs(stuff[i][2])-1;
    const target=stuff[i][7];
    if (target!==0 && target<stuff.length && getdistance(i,target)>gunits[unit][3]) {
      stuff[i][5]=stuff[target][0]; stuff[i][6]=stuff[target][1];
    }
    if (stuff[i][4]<3) {
      const x=stuff[i][5]-stuff[i][0], y=stuff[i][6]-stuff[i][1], move=gunits[unit][0];
      if (x*x<move*move && y*y<move*move) { stuff[i][0]=stuff[i][5]; stuff[i][1]=stuff[i][6]; stuff[i][4]=3; }
      else if (x||y) { const root=squareroot(x*x+y*y); stuff[i][0]+=Math.trunc(move*x/root); stuff[i][1]+=Math.trunc(move*y/root); }
    }
  }
  acquireTargets();
}

function acquireTargets() {
  for (let i=0;i<stuff.length;i++) {
    if (stuff[i][2]>=50 || stuff[i][7]!==0 || stuff[i][4]===2) continue;
    for (let j=0;j<stuff.length;j++) {
      if (((stuff[i][2]>0&&stuff[j][2]<0)||(stuff[i][2]<0&&stuff[j][2]>0)) && getdistance(i,j)<300) {
        stuff[i][7]=j; stuff[i][4]=1; break;
      }
    }
  }
}

const imageForType = {1:"fighter",2:"destroy",3:"gun",51:"beacon",52:"generator",53:"teleport",
  54:"large",55:"advanced","-1":"efighter","-2":"edestroy","-3":"egun"};
function drawGame(now) {
  g.fillStyle="#000"; g.fillRect(0,0,800,500);
  drawStarfield(now);
  let enemies=false, lasers=[];
  for (let i=0;i<stuff.length;i++) {
    const s=stuff[i], size=unitSize(s[2]);
    if (s[2]<0) enemies=true;
    if (s[0]<mapx+800 && s[0]+size>mapx && s[1]<mapy+500 && s[1]+size>mapy && currentFrames[imageForType[s[2]]])
      g.drawImage(currentFrames[imageForType[s[2]]],s[0]-mapx,s[1]-mapy);
    const unit=Math.abs(s[2])-1, target=s[7];
    if (s[2]<50 && target!==0 && target<stuff.length && getdistance(i,target)<=gunits[unit][3])
      lasers.push([i,target,unit]);
  }
  resolveCombat(lasers);
  drawSelection();
  drawPanel();
  if (!enemies) area=12;
}

function resolveCombat(lasers) {
  const dead=new Set();
  lasers.forEach(([i,j,unit])=>{
    if (!stuff[i]||!stuff[j]||dead.has(j)) return;
    stuff[i][5]=stuff[i][0]; stuff[i][6]=stuff[i][1];
    stuff[j][3]-=gunits[unit][2];
    g.strokeStyle=stuff[i][2]<0?["yellow","red","pink","orange"][Math.floor(Math.random()*4)]:
      ["blue","green","white","cyan"][Math.floor(Math.random()*4)];
    g.beginPath(); g.moveTo(stuff[i][0]+gunits[unit][1]/2-mapx,stuff[i][1]+gunits[unit][1]/2-mapy);
    g.lineTo(stuff[j][0]+15-mapx,stuff[j][1]+25-mapy); g.stroke();
    if (stuff[j][3]<=0) dead.add(j);
  });
  [...dead].sort((a,b)=>b-a).forEach(removeUnit);
}
function removeUnit(index) {
  stuff.splice(index,1);
  selected=selected.filter(i=>i!==index).map(i=>i>index?i-1:i);
  if (!selected.length) selected=[-1];
  stuff.forEach(s=>{ if(s[7]===index)s[7]=0; else if(s[7]>index)s[7]--; });
}
function drawSelection() {
  g.strokeStyle="#fff";
  if (selected[0]===-1) return;
  selected.forEach(i=>{ if(stuff[i]) g.strokeRect(stuff[i][0]-mapx,stuff[i][1]-mapy,unitSize(stuff[i][2]),unitSize(stuff[i][2])); });
}
function label(text,x,y,color="#fff") { g.fillStyle=color; g.font="14px 'Times New Roman'"; g.textAlign="left"; g.textBaseline="alphabetic"; g.fillText(text,x,y); }
function drawPanel() {
  g.fillStyle="#320000";g.fillRect(100,500,700,100);
  g.strokeStyle="#fff"; [[0,500,800,500],[600,500,600,600],[700,500,700,600],[600,533,800,533],[600,566,800,566]].forEach(l=>{g.beginPath();g.moveTo(l[0],l[1]);g.lineTo(l[2],l[3]);g.stroke()});
  g.fillStyle="#444";g.fillRect(0,500,100,100);
  g.fillStyle="#00f";g.fillRect(mapx*100/mapsizex,mapy*100/mapsizey+500,80000/mapsizex,50000/mapsizey);
  stuff.forEach(s=>{g.fillStyle=s[2]<0?"red":"#0f0";const size=unitSize(s[2]);g.fillRect(s[0]*100/mapsizex,s[1]*100/mapsizey+500,Math.max(1,size*100/mapsizex),Math.max(1,size*100/mapsizey))});
  if (selected[0]!==-1 && stuff[selected[0]]) {
    const s=stuff[selected[0]], type=s[2];
    if (type>0&&type<50) {
      label("Attack",610,523);label("Move",710,523);label("Stop",610,556);
      label(bcommands[type+1][0],110,519,"#0f0"); label("Shields:   "+s[3],110,538,"#00f");
      label("Speed:   "+gunits[type-1][0],110,557,"#aaa");label("Damage:   "+gunits[type-1][2],110,576,"#aaa");
      label("Range:   "+gunits[type-1][3],110,595,"#aaa");label(act[s[4]],610,589,"#00f");label(act[action],710,589,"#00f");
    } else if(type>50) {
      const row=bcommands[type-51]; label(row[0],604,523);label(row[1],704,523);label(row[2],604,556);label(row[3],704,556);
      if(action)label(row[action-1],710,589,"#00f");
      label(type>51?bcommands[0][type-52]:"Teleport Beacon",110,519,"#0f0");label("Shields:   "+s[3],110,538,"#00f");
    }
    label("Selected Units:   "+selected.length,310,566,"pink");
  }
  label("Energy:   "+energy,310,533,"yellow");
}
function drawIntro() {
  if (isTutorial) leaveTutorial();
  g.fillStyle="#000";g.fillRect(0,0,800,600);
  label("-*-*-*- SPACE GAME -*-*-*-",20,55,"#0f0"); 
  label("Real Time Strategy Game with a space theme.",20,95,"#0f0");
  label("Designed to be played with a mouse and keyboard on 1990s sized screens.",20,120,"#0f0");
  label("Not much, but impressive for a lone 16 year old around the year 2000.",20,145,"#0f0");
  label("I've had AI add a tutorial level to try or there's the randomish original level",20,170,"#0f0");

  button(100,520,280,55,"Tutorial");
  button(420,520,280,55,"Original");
}
function drawPause() { g.fillStyle="#000";g.fillRect(0,0,800,600);label("PAUSED",330,280,"yellow");button(360,450,81,50,"Exit");button(700,500,81,50,"Cancel"); }
function drawVictory() { label("YOU ARE VICTORIOUS!",10,250,"yellow");button(360,450,81,50,"Exit"); }
function frame(now) {
  updateAnimatedFrames(now);
  if (area===1) drawIntro();
  else if (area===2) drawPause();
  else if (area===10) { updateGame(); drawGame(now); }
  else if (area===12) drawVictory();
  if (!imagesReady) { g.fillStyle="#000";g.fillRect(0,0,800,600);label("Loading images…",340,300,"#0f0"); }
  requestAnimationFrame(frame);
}
preloadImages().catch(error=>{ console.error(error); label(error.message,20,300,"red"); });
requestAnimationFrame(frame);
</script>
</body>
